[package]
name = "paperrust-api"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls", "macros", "chrono", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "tiff", "webp"] }
pdfium-render = "0.8"
sha2 = "0.10"
rand = "0.10"
aes-gcm = "0.10"
url = "2"
jsonwebtoken = { version = "10.3", default-features = true, features = ["rust_crypto"] }

[dev-dependencies]
rsa = { version = "0.9.10", features = ["pem", "std"] }
# rsa 0.9 still uses rand_core 0.6. Production code uses rand 0.10.
rand08 = { package = "rand", version = "0.8.8" }
