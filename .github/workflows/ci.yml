name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --locked --manifest-path backend/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: npm test
        run: npm ci && npm test
      - name: npm audit
        run: npm audit --audit-level=high
